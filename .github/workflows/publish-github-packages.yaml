name: 'Publish PowerShell Module to GitHub Packages'

on:
  push:
    branches:
      - main
    paths:
      - '**/*.psd1'
  workflow_dispatch:
    inputs:
      working_directory:
        type: string
        description: What working directory should be passed to the script
        default: "github_workspace"

jobs:
  test:
    name: 'Lint and Test'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # Keep in step with test.yaml. The Conftest and Trivy suites skip themselves when their CLI
      # is missing, so without this the nine tests covering the gate logic (deny handling,
      # -SoftFail, -FailOnWarn, HIGH/CRITICAL failure, waiver discovery) silently do not run in
      # the job that gates publishing, which is the last place that should happen.
      - name: Install the CLIs the Conftest and Trivy suites need
        run: |
          Import-Module ./LibreDevOpsHelpers/LibreDevOpsHelpers.psd1 -Force
          Install-LdoConftest
          Install-LdoTrivy
          conftest --version
          trivy --version

      - name: Run analyzer and tests
        run: ./Invoke-Tests.ps1

  run-script:
    name: 'Run Script'
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v3

      - name: Build
        id: run-script
        shell: pwsh
        run: |
          if ("${{ inputs.working_directory }}" -eq "github_workspace") 
          {
            $workingDirectory = "${{ github.workspace }}"
          }
          else
          {
            $workingDirectory = "${{ inputs.working_directory }}"
          }
          
          .\Publish-ToGitHubPackages.ps1 `
            -WorkingDirectory $workingDirectory

        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.GITHUB_REPOSITORY_OWNER }}