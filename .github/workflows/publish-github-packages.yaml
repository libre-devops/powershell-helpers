name: 'Publish PowerShell Module to GitHub Packages'

on:
  push:
    branches:
      - main
    paths:
      - '**/*.psd1'
  workflow_dispatch:
    inputs:
      working_directory:
        type: string
        description: What working directory should be passed to the script
        default: "github_workspace"

jobs:
  # The one definition of the gate, shared with every other workflow. Do not inline a copy here:
  # a duplicated job silently drifts from the real one, which is exactly how the Conftest and Trivy
  # tests ended up skipped in the gate that guards publishing.
  test:
    name: 'Lint and Test'
    uses: ./.github/workflows/test.yaml

  run-script:
    name: 'Run Script'
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v3

      - name: Build
        id: run-script
        shell: pwsh
        run: |
          if ("${{ inputs.working_directory }}" -eq "github_workspace") 
          {
            $workingDirectory = "${{ github.workspace }}"
          }
          else
          {
            $workingDirectory = "${{ inputs.working_directory }}"
          }
          
          .\Publish-ToGitHubPackages.ps1 `
            -WorkingDirectory $workingDirectory

        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.GITHUB_REPOSITORY_OWNER }}